#YAML file for automating workflow
name: Welcome New Contributors

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write  # 👈 Required to post a comment on PRs

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: "🎉 Thanks for your first pull request! Someone will review it soon. Welcome aboard! 🚀"

